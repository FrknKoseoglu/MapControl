plugins {
    id 'com.android.application'
}

def localSettings = new Properties()
def localSettingsFile = rootProject.file('local.properties')
if (localSettingsFile.exists()) {
    localSettingsFile.withInputStream { localSettings.load(it) }
}
def readSetting = { String name ->
    providers.gradleProperty(name).orNull ?: System.getenv(name) ?: localSettings.getProperty(name, '')
}

android {
    namespace 'com.mapcontrol'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId "com.mapcontrol"
        minSdk 29
        targetSdk 28
        versionCode 2
        versionName "1.2.4"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'GLITCHTIP_DSN', groovy.json.JsonOutput.toJson(readSetting('GLITCHTIP_DSN'))
    }

    signingConfigs {
        release {
            storeFile file("mapcontrol-release.keystore")
            storePassword readSetting('RELEASE_STORE_PASSWORD') ?: readSetting('releaseKeyPassword')
            keyAlias "mapcontrol"
            keyPassword readSetting('RELEASE_KEY_PASSWORD') ?: readSetting('releaseKeyPassword')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }

    aaptOptions {
        ignoreAssetsPattern '!*.bak'
    }
}

dependencies {
    implementation 'io.sentry:sentry-android:8.24.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'

    def filamentVersion = '1.53.4'
    implementation "com.google.android.filament:filament-android:${filamentVersion}"
    implementation "com.google.android.filament:gltfio-android:${filamentVersion}"
    implementation "com.google.android.filament:filament-utils-android:${filamentVersion}"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
